name: Backend baseline

on:
  push:
    branches:
      - main
      - dev/backend
      - dev/frontend
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks (Python 3.12 / PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splitbill
          POSTGRES_PASSWORD: splitbill
          POSTGRES_DB: splitbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitbill -d splitbill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://splitbill:splitbill@localhost:5432/splitbill_test
      TEST_DATABASE_URL: postgresql+psycopg://splitbill:splitbill@localhost:5432/splitbill_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e '.[dev]'
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Check implemented OpenAPI snapshot
        run: python -m splitbill.openapi --check
      - name: Apply migrations and replay seed on a fresh database
        run: |
          python -m alembic upgrade head
          python -m splitbill.seed
          python -m splitbill.seed
      - name: Run the complete baseline test suite
        run: python -m pytest
