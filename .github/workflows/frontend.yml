name: Frontend and full-stack integration

on:
  push:
    branches: [main, dev/frontend, dev/backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js checks / real PostgreSQL browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splitbill
          POSTGRES_PASSWORD: splitbill
          POSTGRES_DB: splitbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitbill -d splitbill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://splitbill:splitbill@localhost:5432/splitbill_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck and exact money checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Install backend and browser test tooling
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e './backend[dev]'
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Check browser integration runner
        run: |
          python -m ruff check scripts/test-frontend-integration.py
          python -m ruff format --check scripts/test-frontend-integration.py
      - name: Production build and browser/API/PostgreSQL checks
        run: python scripts/test-frontend-integration.py
      - name: Upload actual application screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-screenshots
          path: |
            design-system/frontend-desktop.png
            design-system/frontend-mobile.png
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failure
          path: /tmp/splitbill-frontend-failure-*/
          if-no-files-found: ignore
